<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3FBF7F" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/kharcha-design.css" />
  <title>Record — Kharcha</title>
  <style>
    .voice-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .voice-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      flex-shrink: 0;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--ink-muted);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: var(--r-control);
      transition: background 140ms ease, color 140ms ease;
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
    }

    .back-btn:hover {
      background: rgba(18,41,36,.07);
      color: var(--ink-body);
    }

    .voice-bar-right {
      font-size: 13px;
      color: var(--ink-muted);
    }

    .voice-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 24px 24px 80px;
      text-align: center;
    }

    /* ── State containers ── */
    #stateIdle,
    #stateRecording,
    #stateProcessing,
    #voiceError {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    /* ── Idle ── */
    .idle-hint {
      font-size: 15px;
      color: var(--ink-muted);
      margin-top: 28px;
      line-height: 1.5;
      max-width: 260px;
    }

    .hero-mic {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(160deg, var(--brand-light) 0%, var(--brand-deep) 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.30),
        0 14px 36px rgba(47,167,108,.35);
      position: relative;
      transition: transform 160ms ease;
      flex-shrink: 0;
      animation: mic-pop 620ms cubic-bezier(.34,1.56,.64,1) 250ms both;
    }

    .hero-mic:hover  { transform: scale(1.05); }
    .hero-mic:active { transform: scale(.95); }

    .hero-mic:focus-visible {
      outline: 3px solid var(--brand);
      outline-offset: 5px;
    }

    .hero-mic.idle::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid var(--brand);
      opacity: 0;
      animation: mic-ring 3s ease-out 870ms infinite;
    }

    /* ── Recording ── */
    .recording-ring {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }

    .recording-ring .hero-mic { animation: none; }

    .recording-ring::before,
    .recording-ring::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(63,191,127,.5);
      animation: rec-ring 2s ease-out infinite;
    }

    .recording-ring::after {
      inset: -16px;
      border-color: rgba(63,191,127,.25);
      animation-delay: 0.6s;
    }

    @keyframes rec-ring {
      0%   { transform: scale(.9); opacity: .8; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .rec-timer {
      font-size: 42px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      margin-top: 36px;
      line-height: 1;
    }

    .rec-label {
      font-size: 14px;
      color: var(--ink-muted);
      margin-top: 8px;
    }

    .waveform {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 40px;
      margin-top: 28px;
    }

    .wave-bar {
      width: 4px;
      border-radius: 2px;
      background: var(--brand);
      animation: wave 1.1s ease-in-out infinite;
    }

    .wave-bar:nth-child(1) { animation-delay: 0.00s; }
    .wave-bar:nth-child(2) { animation-delay: 0.10s; }
    .wave-bar:nth-child(3) { animation-delay: 0.20s; }
    .wave-bar:nth-child(4) { animation-delay: 0.30s; }
    .wave-bar:nth-child(5) { animation-delay: 0.40s; }
    .wave-bar:nth-child(6) { animation-delay: 0.30s; }
    .wave-bar:nth-child(7) { animation-delay: 0.20s; }
    .wave-bar:nth-child(8) { animation-delay: 0.10s; }
    .wave-bar:nth-child(9) { animation-delay: 0.00s; }

    @keyframes wave {
      0%, 100% { height: 6px;  opacity: .4; }
      50%       { height: 32px; opacity: 1;  }
    }

    .stop-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: var(--r-pill);
      background: rgba(18,41,36,.07);
      border: 1px solid rgba(18,41,36,.12);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-body);
      cursor: pointer;
      margin-top: 32px;
      transition: background 140ms ease;
    }

    .stop-btn:hover { background: rgba(18,41,36,.12); }

    .stop-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: #c0392b;
    }

    /* ── Processing ── */
    .processing-spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid rgba(63,191,127,.2);
      border-top-color: var(--brand);
      animation: spin 900ms linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .processing-label {
      font-size: 19px;
      font-weight: 500;
      color: var(--ink);
      margin-top: 28px;
    }

    .processing-sub {
      font-size: 14px;
      color: var(--ink-muted);
      margin-top: 8px;
    }

    /* ── Upload ── */
    .upload-row {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .upload-label { font-size: 13px; color: var(--ink-muted); }

    .upload-link {
      font-size: 13px;
      color: var(--brand-ink);
      cursor: pointer;
      border: none;
      background: none;
      font: inherit;
      padding: 0;
    }

    .upload-link:hover { text-decoration: underline; }

    #audioFile { display: none; }

    /* ── Error ── */
    .voice-error {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: var(--r-control);
      background: rgba(180,35,24,.08);
      border: 1px solid rgba(180,35,24,.18);
      color: #7a1a11;
      font-size: 14px;
      max-width: 400px;
      text-align: left;
    }

    .retry-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 13px;
      color: var(--brand-ink);
      cursor: pointer;
      border: none;
      background: none;
      font: inherit;
      padding: 0;
      text-decoration: underline;
    }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .wave-bar { height: 16px !important; opacity: .7 !important; }
    }
  </style>
</head>
<body>

<div class="voice-shell">

  <div class="voice-bar">
    <a class="back-btn" href="/">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Dashboard
    </a>
    <span class="voice-bar-right" id="userLabel">User 1</span>
  </div>

  <div class="voice-stage">

    <!-- IDLE -->
    <div id="stateIdle">
      <button class="hero-mic idle" id="micBtn" aria-label="Tap to start recording">
        <svg width="38" height="38" fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="2" width="6" height="11" rx="3" fill="white"/>
          <path d="M5 10a7 7 0 0 0 14 0" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="19" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="8"  y1="22" x2="16" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <p class="idle-hint">Tap to start recording.<br>Speak in any language — Hinglish works.</p>
      <div class="upload-row">
        <span class="upload-label">Or</span>
        <button class="upload-link" id="uploadTrigger">upload an audio file</button>
        <input type="file" id="audioFile" accept="audio/*,.webm,.wav,.mp3,.m4a" />
      </div>
    </div>

    <!-- RECORDING -->
    <div id="stateRecording" hidden>
      <div class="recording-ring">
        <div class="hero-mic" role="img" aria-label="Recording in progress">
          <svg width="38" height="38" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2" width="6" height="11" rx="3" fill="white"/>
            <path d="M5 10a7 7 0 0 0 14 0" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="19" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="8"  y1="22" x2="16" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <p class="rec-timer" id="timer" aria-live="polite">0:00</p>
      <p class="rec-label">Recording…</p>
      <div class="waveform" aria-hidden="true">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <button class="stop-btn" id="stopBtn">
        <span class="stop-dot" aria-hidden="true"></span>
        Stop recording
      </button>
    </div>

    <!-- PROCESSING -->
    <div id="stateProcessing" hidden>
      <div class="processing-spinner" role="status" aria-label="Processing audio"></div>
      <p class="processing-label" id="processingLabel">Transcribing…</p>
      <p class="processing-sub" id="processingSub">This takes a few seconds on first run.</p>
    </div>

    <!-- Error -->
    <div id="voiceError" hidden>
      <div class="voice-error" id="voiceErrorMsg"></div>
      <button class="retry-link" id="retryBtn">Try again</button>
    </div>

  </div>
</div>

<input type="hidden" id="userId" value="1" />

<script src="/static/js/api.js"></script>
<script>
  const { api, headers, getUserId } = EA;

  document.getElementById("userLabel").textContent = "User " + getUserId();
  api("/me", { headers: headers() })
    .then((me) => {
      document.getElementById("userLabel").textContent = me.display_name;
    })
    .catch(() => {});

  // ── State machine ──────────────────────────────────────────────────────────
  function switchState(name) {
    ["Idle", "Recording", "Processing"].forEach(s => {
      const el = document.getElementById("state" + s);
      if (el) el.hidden = (s !== name);
    });
    document.getElementById("voiceError").hidden = true;
  }

  function showError(msg) {
    switchState("Idle"); // always go back to idle so mic is available again
    document.getElementById("voiceErrorMsg").textContent = msg;
    document.getElementById("voiceError").hidden = false;
  }

  document.getElementById("retryBtn").onclick = () => {
    document.getElementById("voiceError").hidden = true;
  };

  // ── Timer ──────────────────────────────────────────────────────────────────
  let timerInterval = null;
  let timerSeconds = 0;

  function startTimer() {
    timerSeconds = 0;
    updateTimerDisplay();
    timerInterval = setInterval(() => { timerSeconds++; updateTimerDisplay(); }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function updateTimerDisplay() {
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    document.getElementById("timer").textContent = m + ":" + String(s).padStart(2, "0");
  }

  // ── MediaRecorder ──────────────────────────────────────────────────────────
  let mediaRecorder = null;
  let recordedChunks = [];

  document.getElementById("micBtn").onclick = async () => {
    try {
      recordedChunks = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: "audio/webm" });
        stream.getTracks().forEach(t => t.stop());
        processAudio(blob, "recording.webm");
      };
      mediaRecorder.start();
      startTimer();
      switchState("Recording");
    } catch (e) {
      showError("Microphone access denied. Check browser permissions and try again.");
    }
  };

  document.getElementById("stopBtn").onclick = () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    stopTimer();
    switchState("Processing");
  };

  // ── File upload ────────────────────────────────────────────────────────────
  document.getElementById("uploadTrigger").onclick = () => {
    document.getElementById("audioFile").click();
  };

  document.getElementById("audioFile").onchange = () => {
    const f = document.getElementById("audioFile").files[0];
    if (!f) return;
    switchState("Processing");
    processAudio(f, f.name);
  };

  // ── Transcribe → Extract → Navigate ───────────────────────────────────────
  async function processAudio(blob, filename) {
    switchState("Processing");

    // Step 1: transcribe
    document.getElementById("processingLabel").textContent = "Transcribing…";
    document.getElementById("processingSub").textContent = "This takes a few seconds on first run.";

    let transcript;
    try {
      const fd = new FormData();
      fd.append("file", blob, filename);
      const res = await api("/voice/transcribe", {
        method: "POST",
        headers: headers(),
        body: fd,
      });
      transcript = res.transcript;
    } catch (e) {
      showError("Transcription failed. " + (e.message || "Try again."));
      return;
    }

    // Step 2: extract draft
    document.getElementById("processingLabel").textContent = "Extracting draft…";
    document.getElementById("processingSub").textContent = "Almost there.";

    try {
      const data = await api("/voice/extract", {
        method: "POST",
        headers: headers({ "Content-Type": "application/json" }),
        body: JSON.stringify({ transcript }),
      });
      sessionStorage.setItem("kharcha_draft", JSON.stringify(data));
      window.location.href = "/static/kharcha-confirm.html";
    } catch (e) {
      showError("Couldn't extract draft. " + (e.message || "Try again."));
    }
  }
</script>
</body>
</html>
