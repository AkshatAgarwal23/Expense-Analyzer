<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3FBF7F" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/kharcha-design.css" />
  <title>Friends — Kharcha</title>
  <style>
    /* ── Add-friend bar ── */
    .add-friend-row {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 16px 20px;
      margin-bottom: var(--gap);
    }

    .add-friend-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid rgba(18,41,36,.14);
      border-radius: var(--r-control);
      background: rgba(255,255,255,.55);
      font: inherit;
      font-size: 14px;
      color: var(--ink-body);
      outline: none;
      transition: border-color 140ms ease;
      min-width: 0;
    }

    .add-friend-input::placeholder { color: var(--ink-muted); }
    .add-friend-input:focus { border-color: var(--brand); }

    .add-friend-btn {
      padding: 10px 18px;
      border-radius: var(--r-control);
      background: var(--ink);
      color: #fff;
      border: none;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 140ms ease, transform 100ms ease;
      flex-shrink: 0;
    }

    .add-friend-btn:hover  { background: var(--ink-body); }
    .add-friend-btn:active { transform: scale(.97); }

    /* ── Section label ── */
    .section-label {
      font-size: 14px;
      color: var(--ink-muted);
      margin: 0 0 14px;
    }

    /* ── Friend cards grid ── */
    .friends-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Single friend card ── */
    .friend-card {
      padding: 18px 20px;
      border-radius: var(--r-panel);
    }

    .friend-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .friend-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(18,41,36,.08);
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .friend-name {
      font-size: 15px;
      color: var(--ink-body);
      font-weight: 500;
    }

    .friend-status {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 1px;
    }

    .friend-balance {
      margin-left: auto;
      text-align: right;
      flex-shrink: 0;
    }

    .balance-amount {
      font-size: 17px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .balance-phrase {
      font-size: 12px;
      margin-top: 3px;
      white-space: nowrap;
    }

    /* ── Settle form (inline, hidden until balance exists) ── */
    .settle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(18,41,36,.07);
    }

    .settle-input {
      width: 100px;
      padding: 8px 10px;
      border: 1px solid rgba(18,41,36,.14);
      border-radius: var(--r-control);
      background: rgba(255,255,255,.55);
      font: inherit;
      font-size: 13px;
      color: var(--ink-body);
      outline: none;
      font-variant-numeric: tabular-nums;
      transition: border-color 140ms ease;
    }

    .settle-input:focus { border-color: var(--brand); }

    .settle-label {
      font-size: 13px;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    .settle-btn {
      padding: 8px 16px;
      border-radius: var(--r-control);
      background: rgba(42,107,120,.12);
      color: var(--owed-to-you);
      border: 1px solid rgba(42,107,120,.20);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 140ms ease;
      white-space: nowrap;
    }

    .settle-btn:hover { background: rgba(42,107,120,.20); }

    /* ── Accept pending request ── */
    .accept-btn {
      margin-left: auto;
      padding: 7px 14px;
      border-radius: var(--r-control);
      background: rgba(18,41,36,.07);
      color: var(--ink-body);
      border: none;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 140ms ease;
    }

    .accept-btn:hover { background: rgba(18,41,36,.14); }

    /* ── Flash ── */
    .flash-msg {
      font-size: 13px;
      color: var(--owed-to-you);
      margin-top: 8px;
      min-height: 0;
    }

    .flash-msg:empty { display: none; }

    /* ── Error ── */
    .page-error {
      padding: 12px 16px;
      border-radius: var(--r-control);
      background: rgba(180,35,24,.08);
      border: 1px solid rgba(180,35,24,.18);
      color: #7a1a11;
      font-size: 14px;
    }

    /* ── Skeleton ── */
    .friend-card.loading .friend-avatar {
      background: none;
    }

    .skel {
      border-radius: var(--r-control);
      display: inline-block;
    }

    .skel-name   { width: 100px; height: 15px; }
    .skel-sub    { width:  70px; height: 12px; margin-top: 4px; }
    .skel-amount { width:  60px; height: 17px; }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<div class="k-shell">

  <!-- Sidebar -->
  <nav class="k-sidebar glass" aria-label="Main navigation">
    <a class="kharcha-wordmark" href="/"
       style="padding: 4px 12px 16px; display:block;">Kharcha</a>

    <a class="k-nav-item" href="/">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      Dashboard
    </a>

    <a class="k-nav-item active" href="/static/kharcha-friends.html">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="7" r="3.5"/>
        <path d="M2 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/>
        <path d="M19 11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" stroke-width="1.5"/>
        <path d="M22 20c0-2.5-1.8-4.5-4-5" stroke-linecap="round"/>
      </svg>
      Friends
    </a>

    <div style="flex:1"></div>

    <div style="padding: 8px 12px;">
      <label style="font-size:12px;color:var(--ink-muted);display:block;margin-bottom:4px;">User ID</label>
      <input id="userId" type="number" value="1" min="1"
        style="width:100%;padding:6px 10px;border:1px solid rgba(18,41,36,.15);border-radius:var(--r-control);font:inherit;font-size:13px;background:rgba(255,255,255,.5);color:var(--ink-body);" />
    </div>
  </nav>

  <!-- Main -->
  <main class="k-content">

    <!-- Greeting -->
    <div class="greeting-row">
      <span class="greeting-text">Friends</span>
      <button class="identity-chip glass" aria-label="Switch user">
        <span class="initial" id="userInitial">A</span>
        <span class="chip-name" id="userName">Akshat</span>
        <svg class="chevron" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
    </div>

    <!-- Add friend -->
    <div class="glass add-friend-row">
      <input class="add-friend-input" id="friendIdInput" type="number" min="1"
             placeholder="User ID to add as friend" aria-label="Friend user ID" />
      <button class="add-friend-btn" id="btnAddFriend">Send request</button>
    </div>

    <p class="flash-msg" id="flashMsg" aria-live="polite"></p>
    <div class="page-error" id="pageError" hidden></div>

    <!-- Pending requests -->
    <div id="pendingSection" hidden>
      <p class="section-label">Pending requests</p>
      <div class="friends-grid" id="pendingList"></div>
    </div>

    <!-- Friends with balances -->
    <div style="margin-top: 20px;">
      <p class="section-label">Balances</p>
      <div class="friends-grid" id="friendsList">
        <!-- Skeleton -->
        <div class="friend-card glass loading">
          <div class="friend-header">
            <div class="friend-avatar">
              <div class="skel skeleton" style="width:40px;height:40px;border-radius:50%;"></div>
            </div>
            <div>
              <div class="skel skeleton skel-name"></div>
              <div class="skel skeleton skel-sub"></div>
            </div>
            <div class="friend-balance">
              <div class="skel skeleton skel-amount"></div>
            </div>
          </div>
        </div>
        <div class="friend-card glass loading">
          <div class="friend-header">
            <div class="friend-avatar">
              <div class="skel skeleton" style="width:40px;height:40px;border-radius:50%;"></div>
            </div>
            <div>
              <div class="skel skeleton skel-name"></div>
              <div class="skel skeleton skel-sub"></div>
            </div>
            <div class="friend-balance">
              <div class="skel skeleton skel-amount"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Mic -->
<div class="mic-dock" aria-label="Voice actions">
  <button class="mic-btn" aria-label="Record a new expense"
          onclick="location.href='/static/kharcha-voice-record.html'">
    <svg width="28" height="28" fill="none" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="9" y="2" width="6" height="11" rx="3" fill="white"/>
      <path d="M5 10a7 7 0 0 0 14 0" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="19" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <line x1="8"  y1="22" x2="16" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <span class="mic-hint">Say your spend</span>
</div>

<script src="/static/js/api.js"></script>
<script>
  const { api, headers, rupees, toPaise, getUserId, setUserId } = EA;

  const userEl = document.getElementById("userId");
  userEl.value = getUserId();
  userEl.addEventListener("change", () => {
    setUserId(userEl.value);
    refreshIdentity();
    load();
  });

  async function refreshIdentity() {
    try {
      const me = await api("/me", { headers: headers() });
      document.getElementById("userName").textContent = me.display_name;
      document.getElementById("userInitial").textContent = me.display_name.charAt(0).toUpperCase();
    } catch {
      const id = getUserId();
      document.getElementById("userName").textContent = "User " + id;
      document.getElementById("userInitial").textContent = String(id).charAt(0);
    }
  }
  refreshIdentity();

  function flash(msg) {
    const el = document.getElementById("flashMsg");
    el.textContent = msg || "";
    if (msg) setTimeout(() => { el.textContent = ""; }, 3000);
  }

  function showError(msg) {
    const el = document.getElementById("pageError");
    el.textContent = msg || "";
    el.hidden = !msg;
  }

  function initial(id) {
    return String(id).charAt(0).toUpperCase();
  }

  // ── Render a single friend card ──────────────────────────────────────────
  function buildFriendCard(f, balance, me) {
    const otherId = f.user_a_id === me ? f.user_b_id : f.user_a_id;
    const otherName =
      f.user_a_id === me ? f.user_b_display_name : f.user_a_display_name;
    const isPending = f.status === "pending";
    const canAccept = isPending && f.requested_by_id !== me;
    const net = balance ? balance.net_paise : 0;

    const card = document.createElement("div");
    card.className = "friend-card glass";

    // Header
    let balanceHtml = "";
    if (!isPending && balance) {
      if (net > 0) {
        balanceHtml = `
          <div class="friend-balance">
            <div class="balance-amount money-owed">${rupees(net)}</div>
            <div class="balance-phrase money-owed">owes you</div>
          </div>`;
      } else if (net < 0) {
        balanceHtml = `
          <div class="friend-balance">
            <div class="balance-amount money-owing">${rupees(-net)}</div>
            <div class="balance-phrase money-owing">you owe</div>
          </div>`;
      } else {
        balanceHtml = `
          <div class="friend-balance">
            <div class="balance-amount" style="color:var(--ink-muted)">Settled</div>
          </div>`;
      }
    }

    card.innerHTML = `
      <div class="friend-header">
        <div class="friend-avatar">${(otherName || "?").charAt(0).toUpperCase()}</div>
        <div>
          <div class="friend-name">${otherName || ("User " + otherId)}</div>
          <div class="friend-status">${isPending
            ? (f.requested_by_id === me ? "Request sent" : "Wants to connect")
            : "Friend"}</div>
        </div>
        ${balanceHtml}
        ${canAccept
          ? `<button class="accept-btn" data-id="${f.id}">Accept</button>`
          : ""}
      </div>
      ${!isPending && net < 0 ? `
        <div class="settle-row">
          <span class="settle-label">Settle</span>
          <input class="settle-input" type="number" min="0.01" step="0.01"
                 value="${(-net / 100).toFixed(2)}"
                 data-to="${otherId}" aria-label="Settlement amount" />
          <button class="settle-btn" data-to="${otherId}">Mark paid</button>
        </div>` : ""}
    `;

    // Accept
    const acceptBtn = card.querySelector(".accept-btn");
    if (acceptBtn) {
      acceptBtn.onclick = async () => {
        try {
          await api(`/friendships/${f.id}/accept`, { method: "POST", headers: headers() });
          flash("Friend request accepted");
          load();
        } catch (e) { showError(e.message || "Couldn't accept request."); }
      };
    }

    // Settle
    const settleBtn = card.querySelector(".settle-btn");
    if (settleBtn) {
      settleBtn.onclick = async () => {
        const input = card.querySelector(".settle-input");
        try {
          await api("/settlements", {
            method: "POST",
            headers: headers({ "Content-Type": "application/json" }),
            body: JSON.stringify({
              to_user_id: Number(settleBtn.dataset.to),
              amount_paise: toPaise(input.value),
              settled_on: new Date().toISOString().slice(0, 10),
            }),
          });
          flash("Settlement recorded");
          load();
        } catch (e) { showError(e.message || "Settlement failed."); }
      };
    }

    return card;
  }

  // ── Load ─────────────────────────────────────────────────────────────────
  async function load() {
    showError("");
    const me = Number(getUserId());

    try {
      const [friendships, balances] = await Promise.all([
        api("/friendships", { headers: headers() }),
        api("/balances/",    { headers: headers() }),
      ]);

      const balanceMap = {};
      balances.forEach(b => { balanceMap[b.user_id] = b; });

      const accepted = friendships.filter(f => f.status === "accepted");
      const pending  = friendships.filter(f => f.status === "pending");

      // ── Pending section ──
      const pendingSection = document.getElementById("pendingSection");
      const pendingList    = document.getElementById("pendingList");
      if (pending.length) {
        pendingList.innerHTML = "";
        pending.forEach(f => pendingList.appendChild(buildFriendCard(f, null, me)));
        pendingSection.hidden = false;
      } else {
        pendingSection.hidden = true;
      }

      // ── Accepted friends ──
      const friendsList = document.getElementById("friendsList");
      if (!accepted.length) {
        friendsList.innerHTML = `
          <div class="empty-state" style="padding:40px 0;">
            No friends yet — add someone to start splitting
          </div>`;
      } else {
        friendsList.innerHTML = "";
        accepted.forEach(f => {
          const otherId = f.user_a_id === me ? f.user_b_id : f.user_a_id;
          friendsList.appendChild(buildFriendCard(f, balanceMap[otherId] || null, me));
        });
      }
    } catch (e) {
      showError("Couldn't load friends. " + (e.message || "Try refreshing."));
      document.getElementById("friendsList").innerHTML = "";
    }
  }

  // ── Add friend ────────────────────────────────────────────────────────────
  document.getElementById("btnAddFriend").onclick = async () => {
    const input = document.getElementById("friendIdInput");
    const user_id = Number(input.value);
    if (!user_id) {
      showError("Enter a user ID first.");
      return;
    }
    showError("");
    try {
      await api("/friendships", {
        method: "POST",
        headers: headers({ "Content-Type": "application/json" }),
        body: JSON.stringify({ user_id }),
      });
      input.value = "";
      flash("Friend request sent");
      load();
    } catch (e) { showError(e.message || "Couldn't send request."); }
  };

  load();
</script>
</body>
</html>
