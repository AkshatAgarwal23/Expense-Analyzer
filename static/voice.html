<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice expense — confirm</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1c1917;
      --accent: #0f766e;
      --card: #fffdf9;
      --muted: #57534e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top left, #dcefea, var(--bg) 45%);
      color: var(--ink);
      min-height: 100vh;
      padding: 1.5rem;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      display: grid;
      gap: 1.25rem;
    }
    h1 { font-size: 1.5rem; margin: 0; }
    p.lead { color: var(--muted); margin: 0.25rem 0 0; }
    .nav { margin-top: 0.5rem; }
    .nav a { color: var(--accent); }
    section {
      background: var(--card);
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      padding: 1rem 1.1rem;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, textarea, select {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      font: inherit;
      margin-bottom: 0.75rem;
    }
    button {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font: inherit;
      cursor: pointer;
      margin-right: 0.4rem;
      margin-top: 0.25rem;
    }
    button.secondary { background: #44403c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre {
      background: #1c1917;
      color: #e7e5e4;
      padding: 0.75rem;
      border-radius: 8px;
      overflow: auto;
      font-size: 0.8rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .warn { color: #b45309; font-size: 0.9rem; }
    .err { color: #b91c1c; font-size: 0.9rem; }
    .hint { font-size: 0.8rem; color: var(--muted); margin: -0.4rem 0 0.6rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Voice expense</h1>
      <p class="lead">Transcribe → extract draft → edit → confirm. Nothing hits the ledger until Confirm.</p>
      <p class="nav"><a href="/static/index.html">← Dashboard</a></p>
    </header>

    <section>
      <label for="userId">X-User-Id</label>
      <input id="userId" type="number" value="1" min="1" />

      <label for="audio">Audio file (wav / webm / mp3 / m4a)</label>
      <input id="audio" type="file" accept="audio/*,.webm,.wav,.mp3,.m4a" />

      <div class="row">
        <button type="button" id="btnTranscribe">1. Transcribe</button>
        <button type="button" id="btnRecord" class="secondary">Record</button>
        <button type="button" id="btnStop" class="secondary" disabled>Stop</button>
      </div>
      <p id="recordStatus" class="warn"></p>
    </section>

    <section>
      <label for="transcript">Transcript</label>
      <textarea id="transcript" rows="3" placeholder="Or paste transcript here…"></textarea>
      <button type="button" id="btnExtract">2. Extract draft</button>
      <p id="prepass" class="warn"></p>
    </section>

    <section id="draftSection" hidden>
      <h2 style="font-size:1.1rem;margin:0 0 0.75rem">3. Edit draft &amp; confirm</h2>
      <label for="amountRupees">Amount (₹)</label>
      <input id="amountRupees" type="number" min="0" step="0.01" />
      <p class="hint">Stored as paise in the API (₹1 = 100 paise).</p>
      <label for="category">Category</label>
      <select id="category"></select>
      <label for="description">Description</label>
      <input id="description" type="text" />
      <label for="spentOn">Date</label>
      <input id="spentOn" type="date" />
      <label for="participants">Participant user ids (comma-separated)</label>
      <input id="participants" type="text" />
      <p id="warnings" class="warn"></p>
      <button type="button" id="btnConfirm">Confirm → ledger</button>
    </section>

    <section>
      <label>Result</label>
      <pre id="out">{}</pre>
      <p id="error" class="err"></p>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const out = (obj) => { $("out").textContent = JSON.stringify(obj, null, 2); };
    const headers = () => ({ "X-User-Id": $("userId").value });

    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedBlob = null;
    let categories = [];

    function showError(err) {
      $("error").textContent = err ? String(err) : "";
    }

    async function api(path, options = {}) {
      showError("");
      const res = await fetch(path, options);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = text; }
      if (!res.ok) {
        throw new Error(typeof data === "object" ? (data.detail || JSON.stringify(data)) : text);
      }
      return data;
    }

    async function loadCategories() {
      categories = await api("/categories", { headers: headers() });
      const sel = $("category");
      sel.innerHTML = categories.map((c) =>
        `<option value="${c.id}">${c.name}</option>`
      ).join("");
    }

    $("userId").onchange = () => loadCategories().catch((e) => showError(e.message || e));

    $("btnRecord").onclick = async () => {
      recordedChunks = [];
      recordedBlob = null;
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        recordedBlob = new Blob(recordedChunks, { type: "audio/webm" });
        $("recordStatus").textContent = "Recording ready — click Transcribe.";
        stream.getTracks().forEach((t) => t.stop());
      };
      mediaRecorder.start();
      $("btnRecord").disabled = true;
      $("btnStop").disabled = false;
      $("recordStatus").textContent = "Recording…";
    };

    $("btnStop").onclick = () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      $("btnRecord").disabled = false;
      $("btnStop").disabled = true;
    };

    $("btnTranscribe").onclick = async () => {
      try {
        const fd = new FormData();
        const fileInput = $("audio");
        if (recordedBlob) {
          fd.append("file", recordedBlob, "recording.webm");
        } else if (fileInput.files[0]) {
          fd.append("file", fileInput.files[0]);
        } else {
          throw new Error("Choose a file or record audio first");
        }
        const data = await api("/voice/transcribe", { method: "POST", headers: headers(), body: fd });
        $("transcript").value = data.transcript;
        out(data);
      } catch (e) { showError(e.message || e); }
    };

    $("btnExtract").onclick = async () => {
      try {
        if (!categories.length) await loadCategories();
        const transcript = $("transcript").value.trim();
        if (!transcript) throw new Error("Transcript is empty");
        const data = await api("/voice/extract", {
          method: "POST",
          headers: { ...headers(), "Content-Type": "application/json" },
          body: JSON.stringify({ transcript }),
        });
        const d = data.draft;
        $("amountRupees").value = (d.amount_paise / 100).toFixed(2);
        $("category").value = String(d.category_id);
        $("description").value = d.description;
        $("spentOn").value = d.spent_on;
        $("participants").value = (d.participant_ids || []).join(",");
        $("warnings").textContent = (d.warnings || []).join(" · ");
        $("prepass").textContent = "Prepass: " + JSON.stringify(data.prepass);
        $("draftSection").hidden = false;
        out(data);
      } catch (e) { showError(e.message || e); }
    };

    $("btnConfirm").onclick = async () => {
      try {
        const participant_ids = $("participants").value
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean)
          .map(Number);
        const rupees = Number($("amountRupees").value);
        const body = {
          amount_paise: Math.round(rupees * 100),
          category_id: Number($("category").value),
          description: $("description").value,
          spent_on: $("spentOn").value,
          participant_ids,
          split_mode: "equal",
          source: "voice",
        };
        const data = await api("/voice/confirm", {
          method: "POST",
          headers: { ...headers(), "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        out(data);
      } catch (e) { showError(e.message || e); }
    };

    loadCategories().catch((e) => showError(e.message || e));
  </script>
</body>
</html>
