<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3FBF7F" />
  <meta name="description" content="Kharcha — voice-first expense tracker" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/kharcha-design.css" />
  <title>Kharcha</title>
  <style>
    /* ── Dashboard-specific layout ── */
    .money-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 28px 22px 24px;
    }

    .hero-amount {
      font-size: 46px;
      font-weight: 400;
      letter-spacing: -0.035em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .hero-label {
      font-size: 14px;
      color: var(--ink-muted);
      margin-top: 6px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
    }

    .section-label {
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-muted);
      margin: 0 0 14px;
    }

    /* Expense list row */
    .expense-meta {
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .expense-amount {
      font-size: 15px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      white-space: nowrap;
    }

    /* Balance rows */
    .balance-name {
      font-size: 15px;
      color: var(--ink-body);
    }

    .balance-phrase {
      font-size: 13px;
      margin-top: 2px;
    }

    .balance-amount {
      font-size: 15px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* Spend bar label */
    .bar-label {
      font-size: 14px;
      color: var(--ink-body);
    }

    .bar-amount {
      font-size: 13px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    @media (max-width: 860px) {
      .stat-row { grid-template-columns: 1fr; }
      .money-header { padding: 20px 16px 18px; }
      .hero-amount { font-size: 38px; }
    }
  </style>
</head>
<body>

<div class="k-shell">

  <!-- ── Sidebar ── -->
  <nav class="k-sidebar glass" aria-label="Main navigation">
    <a class="kharcha-wordmark" href="/" style="padding: 4px 12px 16px; display:block;">
      Kharcha
    </a>

    <a class="k-nav-item active" href="/">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      Dashboard
    </a>

    <a class="k-nav-item" href="/static/kharcha-friends.html">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="7" r="3.5"/>
        <path d="M2 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/>
        <path d="M19 11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" stroke-width="1.5"/>
        <path d="M22 20c0-2.5-1.8-4.5-4-5" stroke-linecap="round"/>
      </svg>
      Friends
    </a>

    <div style="flex:1"></div>

    <!-- User switcher placeholder -->
    <div style="padding: 8px 12px;">
      <label style="font-size:12px;color:var(--ink-muted);display:block;margin-bottom:4px;">User ID</label>
      <input id="userId" type="number" value="1" min="1"
        style="width:100%;padding:6px 10px;border:1px solid rgba(18,41,36,.15);border-radius:var(--r-control);font:inherit;font-size:13px;background:rgba(255,255,255,.5);color:var(--ink-body);" />
    </div>
  </nav>

  <!-- ── Main content ── -->
  <main class="k-content">

    <!-- Greeting row -->
    <div class="greeting-row">
      <span class="greeting-text" id="greetText">Hi</span>
      <button class="identity-chip glass" id="identityChip" aria-label="Switch user">
        <span class="initial" id="userInitial">A</span>
        <span class="chip-name" id="userName">Akshat</span>
        <svg class="chevron" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
    </div>

    <!-- Money header -->
    <div class="glass k-panel money-header">
      <p class="hero-label">This month's spend</p>
      <p class="hero-amount t-money" id="heroAmount">₹0</p>
      <div class="stat-row" style="margin-top:20px;">
        <div class="stat-card glass">
          <span class="t-label">You're owed</span>
          <span class="t-stat t-money money-owed" id="statOwed">₹0</span>
        </div>
        <div class="stat-card glass">
          <span class="t-label">You owe</span>
          <span class="t-stat t-money money-owing" id="statOwing">₹0</span>
        </div>
      </div>
    </div>

    <!-- Spend by category -->
    <section class="glass k-panel">
      <p class="section-label">Spend by category</p>
      <div id="categoryChart">
        <div class="empty-state">No spend yet — say your first one</div>
      </div>
    </section>

    <!-- Balances -->
    <section class="glass k-panel">
      <p class="section-label">Balances</p>
      <ul class="k-list" id="balanceList">
        <li class="k-list-row">
          <div class="empty-state" style="padding:20px 0;">No balances yet</div>
        </li>
      </ul>
    </section>

    <!-- Recent expenses -->
    <section class="glass k-panel">
      <p class="section-label">Recent expenses</p>
      <ul class="k-list" id="expenseList">
        <li class="k-list-row">
          <div class="empty-state" style="padding:20px 0;">No expenses yet — say your first one</div>
        </li>
      </ul>
    </section>

    <!-- Error banner (hidden by default) -->
    <div id="errorBanner" hidden
      style="padding:14px 18px;border-radius:var(--r-panel);background:rgba(180,35,24,.08);border:1px solid rgba(180,35,24,.18);color:#7a1a11;font-size:14px;">
      <strong id="errorMsg"></strong>
      <span id="errorDetail" style="color:#9a3028;margin-left:6px;"></span>
    </div>

  </main>
</div>

<!-- ── Mic dock ── -->
<div class="mic-dock" aria-label="Voice actions">
  <button class="mic-btn" id="micBtn" aria-label="Record a new expense">
    <svg width="28" height="28" fill="none" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="9" y="2" width="6" height="11" rx="3" fill="white"/>
      <path d="M5 10a7 7 0 0 0 14 0" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="19" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <line x1="8"  y1="22" x2="16" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <span class="mic-hint">Say your spend</span>
</div>

<script src="/static/js/api.js"></script>
<script>
  const { api, headers, rupees, bindUserIdInput, getUserId, setUserId } = EA;

  function showError(msg, detail) {
    const b = document.getElementById("errorBanner");
    document.getElementById("errorMsg").textContent = msg || "";
    document.getElementById("errorDetail").textContent = detail || "";
    b.hidden = !msg;
  }

  function setGreeting(name) {
    const initial = name ? name[0].toUpperCase() : "?";
    document.getElementById("greetText").textContent = name ? `Hi ${name}` : "Hi";
    document.getElementById("userInitial").textContent = initial;
    document.getElementById("userName").textContent = name || "User";
  }

  function renderCategories(spend) {
    const el = document.getElementById("categoryChart");
    if (!spend || !spend.length) {
      el.innerHTML = '<div class="empty-state">No spend yet — say your first one</div>';
      return;
    }
    const max = Math.max(...spend.map(s => s.total_paise));
    const catClass = { Food: "food", Transport: "transport", Rent: "rent" };
    el.innerHTML = spend.map(s => {
      const pct = max ? Math.round((s.total_paise / max) * 100) : 0;
      const key = catClass[s.category_name] || "default";
      return `
        <div class="spend-bar-row">
          <span class="bar-label">${s.category_name}</span>
          <div class="bar-track"><div class="bar-fill bar-fill-${key}" style="width:${pct}%"></div></div>
          <span class="bar-amount">${rupees(s.total_paise)}</span>
        </div>`;
    }).join("");
  }

  function renderBalances(balances) {
    const el = document.getElementById("balanceList");
    if (!balances || !balances.length) {
      el.innerHTML = '<li class="k-list-row"><div class="empty-state" style="padding:20px 0;">No accepted friends yet</div></li>';
      return;
    }
    let owedTotal = 0, owingTotal = 0;
    el.innerHTML = balances.map(b => {
      if (b.net_paise > 0) {
        owedTotal += b.net_paise;
        return `<li class="k-list-row">
          <div>
            <div class="balance-name">${b.display_name || ("User " + b.user_id)}</div>
            <div class="balance-phrase money-owed">owes you ${rupees(b.net_paise)}</div>
          </div>
          <span class="balance-amount money-owed">${rupees(b.net_paise)}</span>
        </li>`;
      } else if (b.net_paise < 0) {
        owingTotal += -b.net_paise;
        return `<li class="k-list-row">
          <div>
            <div class="balance-name">${b.display_name || ("User " + b.user_id)}</div>
            <div class="balance-phrase money-owing">you owe ${rupees(-b.net_paise)}</div>
          </div>
          <span class="balance-amount money-owing">${rupees(-b.net_paise)}</span>
        </li>`;
      }
      return `<li class="k-list-row">
        <div class="balance-name">${b.display_name || ("User " + b.user_id)}</div>
        <span style="font-size:13px;color:var(--ink-muted);">Settled up</span>
      </li>`;
    }).join("");

    document.getElementById("statOwed").textContent  = rupees(owedTotal);
    document.getElementById("statOwing").textContent = rupees(owingTotal);
  }

  function renderExpenses(expenses) {
    const el = document.getElementById("expenseList");
    if (!expenses || !expenses.length) {
      el.innerHTML = '<li class="k-list-row"><div class="empty-state" style="padding:20px 0;">No expenses yet — say your first one</div></li>';
      return;
    }
    el.innerHTML = expenses.slice(0, 20).map(e => `
      <li class="k-list-row">
        <div>
          <div style="font-size:15px;color:var(--ink-body);">${e.description || "(no description)"}</div>
          <div class="expense-meta">${e.spent_on}</div>
        </div>
        <span class="expense-amount">${rupees(e.amount_paise)}</span>
      </li>`).join("");
  }

  async function load() {
    showError("");
    const errs = [];

    try {
      const spend = await api("/analytics/spend-by-category", { headers: headers() });
      const totalPaise = spend.reduce((s, c) => s + c.total_paise, 0);
      document.getElementById("heroAmount").textContent = rupees(totalPaise);
      renderCategories(spend);
    } catch (e) {
      errs.push("spend: " + (e.message || e));
    }

    try {
      const balances = await api("/balances/", { headers: headers() });
      renderBalances(balances);
    } catch (e) {
      errs.push("balances: " + (e.message || e));
    }

    try {
      const expenses = await api("/expenses", { headers: headers() });
      renderExpenses(expenses);
    } catch (e) {
      errs.push("expenses: " + (e.message || e));
    }

    if (errs.length) showError("Couldn't load some data.", errs.join(" · "));
  }

  // Greeting: load display_name from GET /me (seeded Akshat/Rahul/Priya)
  async function updateGreeting() {
    const id = getUserId();
    try {
      const me = await api("/me", { headers: headers() });
      localStorage.setItem("kharcha_display_name", me.display_name);
      setGreeting(me.display_name);
    } catch {
      const stored = localStorage.getItem("kharcha_display_name");
      setGreeting(stored || "User " + id);
    }
  }

  // User ID wired to sidebar input
  const userEl = document.getElementById("userId");
  userEl.value = getUserId();
  userEl.addEventListener("change", () => {
    setUserId(userEl.value);
    localStorage.removeItem("kharcha_display_name");
    updateGreeting();
    load();
  });

  // Mic navigates to voice flow
  document.getElementById("micBtn").onclick = () => {
    window.location.href = "/static/kharcha-voice-record.html";
  };

  updateGreeting();
  load();
</script>
</body>
</html>
